name: Build and publish Charba

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Required by the shared Maven publication workflow.
  packages: write

concurrency:
  group: charba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The private registry and browser-equipped runners are for trusted branches.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, instanto-container]
    timeout-minutes: 60
    env:
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN || secrets.FORGEJO_PACKAGE_READ_TOKEN }}
      # Install the engine revisions selected by this project's Playwright driver.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Allocate the job-local browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/charba-browsers-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Verify the complete reactor and Chromium/WebKit contracts
        run: >-
          mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress
          --update-snapshots
          -Dmaven.repo.local="$RUNNER_TEMP/charba-m2-${{ github.run_id }}-${{ github.run_attempt }}"
          clean verify
      - name: Publish quality summary
        if: always()
        continue-on-error: true
        uses: instanto-io/instanto-poms/.github/actions/quality-summary@main
        with:
          sonar-project-key: teavm-charba
          sonar-token: ${{ secrets.SONAR_READ_TOKEN || secrets.SONAR_TOKEN }}
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: '**/target/spotbugs/'
          if-no-files-found: ignore
          retention-days: 7
      - name: Show browser test failures
        if: failure()
        run: |
          find charba-demo/target/failsafe-reports -name '*.txt' -exec cat {} + 2>/dev/null || true
      - name: Remove the job-local Maven and browser caches
        if: always()
        run: >-
          rm -rf -- "$RUNNER_TEMP/charba-m2-${{ github.run_id }}-${{ github.run_attempt }}"
          "$PLAYWRIGHT_BROWSERS_PATH"

  publish-snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Publish Charba snapshots to packages.instanto.io
      goals: clean deploy
      fast-deploy: true
      downstream-checks: false
      sonar: false
      timeout-minutes: 60
    secrets: inherit
